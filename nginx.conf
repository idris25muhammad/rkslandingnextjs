server {
    listen 80;
    server_name rks.polibatam.ac.id;

    root /var/www/rks-landing/out;
    index index.html;

    # --- Compression (core modules) ---
    gzip on;
    gzip_static on;               # serve precompressed .gz produced by `npm run build`
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/html
        text/css
        text/plain
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/manifest+json;

    # --- Brotli (OPTIONAL: requires the `ngx_brotli` module) ---
    # Uncomment these lines only after installing ngx_brotli, otherwise nginx
    # will fail to start. Precompressed .br files are already generated at build.
    # brotli on;
    # brotli_static on;
    # brotli_comp_level 6;
    # brotli_types
    #     text/html text/css text/plain text/xml
    #     application/javascript application/json
    #     image/svg+xml application/manifest+json;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# --- HTTPS / HTTP/2 ---
# If TLS is configured elsewhere, add `http2` to the existing `listen 443 ssl;`
# directive (e.g. `listen 443 ssl http2;`) to enable HTTP/2.
